<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DEINESTY | KPI SaaS v1.5</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: 'Lexend', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px;
        }
        
        /* HEADER STYLING */
        .brand { 
            color: #FFBF00; 
            font-size: 32px; 
            font-weight: bold; 
            margin-bottom: 10px; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .company-name { 
            color: #FFFFFF; 
            font-size: 18px; 
            font-weight: 700;
            margin-bottom: 5px; 
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .version-tag {
            color: #FFBF00;
            font-size: 14px; 
            margin-bottom: 40px;
            letter-spacing: 1px;
        }
        
        /* THE COCKPIT SYMMETRY */
        .cockpit {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1200px; 
            justify-content: center;
            flex-wrap: wrap;
        }
        .card {
            background: #111;
            border: 1px solid #333;
            padding: 20px;
            flex: 1;
            min-width: 180px;
            text-align: center;
            border-radius: 4px;
        }
        .card.profit { border: 2px solid #00FF00; box-shadow: 0 0 10px rgba(0,255,0,0.1); }
        .card.target { border: 2px solid #FFBF00; background: #443a00; } 
        
        .label { font-size: 14px; margin-bottom: 15px; display: block; font-weight: bold; }
        .value { font-size: 32px; font-weight: bold; }
        .amber { color: #FFBF00; }
        .green { color: #00FF00; }
        .gray { color: #A0A0A0; }
    </style>
</head>
<body>

    <div class="brand">The Core | KPI Command Center</div>
    <div class="company-name">BY DEINESTY SYSTEMS</div>
    <div class="version-tag">SAAS INTERFACE V1.5</div>

    <div class="cockpit">
        <div class="card">
            <span class="label">TOTAL SALES</span>
            <span id="sales-val" class="value amber">$0.00</span>
        </div>
        <div class="card">
            <span class="label">AD BURN</span>
            <span id="ads-val" class="value">$0.00</span>
        </div>
        <div class="card profit">
            <span class="label" style="color: #00FF00;">TRUE NET PROFIT</span>
            <span id="profit-val" class="value green">$0.00</span>
        </div>
        <div class="card target">
            <span class="label">TARGET PROFIT</span>
            <span id="target-val" class="value">$0.00</span>
        </div>
        <div class="card">
            <span class="label gray">MARGIN %</span>
            <span id="margin-val" class="value gray">0%</span>
        </div>
    </div>

    <div id="rocket" style="font-size: 80px; margin-top: 40px; transition: 0.3s;">🚀</div>
    <div id="status-text" style="margin-top: 10px; font-weight: bold; color: #555;">SYSTEMS NOMINAL</div>

    <script src="engine.js"></script>

</body>
</html>
