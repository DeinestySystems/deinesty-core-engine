<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DEINESTY | KPI SaaS v1.5</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: 'Lexend', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px;
        }
        .brand { color: #FFBF00; font-size: 28px; font-weight: bold; margin-bottom: 5px; }
        .version { color: #FFBF00; font-size: 11px; margin-bottom: 40px; letter-spacing: 1px; }
        
        /* THE COCKPIT SYMMETRY */
        .cockpit {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1150px; /* Matches your CORE_WIDTH */
            justify-content: center;
        }
        .card {
            background: #111;
            border: 1px solid #333;
            padding: 20px;
            flex: 1;
            text-align: center;
            border-radius: 4px;
        }
        .card.profit { border: 2px solid #00FF00; }
        .card.target { border: 2px solid #FFBF00; background: #443a00; } /* Matches your inputBox color */
        
        .label { font-size: 14px; margin-bottom: 15px; display: block; }
        .value { font-size: 32px; font-weight: bold; }
        .amber { color: #FFBF00; }
        .green { color: #00FF00; }
    </style>
</head>
<body>

    <div class="brand">The Core | KPI Command Center</div>
    <div class="version">by DEINESTY Systems // SaaS v1.5</div>

    <div class="cockpit">
        <div class="card">
            <span class="label">TOTAL SALES</span>
            <span class="value amber" id="sales">$0.00</span>
        </div>
        <div class="card">
            <span class="label">AD BURN</span>
            <span class="value">$0.00</span>
        </div>
        <div class="card profit">
            <span class="label" style="color: #00FF00;">TRUE NET PROFIT</span>
            <span class="value green" id="net">$0.00</span>
        </div>
        <div class="card target">
            <span class="label">TARGET PROFIT</span>
            <span class="value">$0.00</span>
        </div>
    </div>

    <div style="font-size: 80px; margin-top: 40px;">🚀</div>

</body>
</html>
