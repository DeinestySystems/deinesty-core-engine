<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DEINESTY | KPI SaaS v1.5</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: 'Lexend', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px;
        }
        
        /* HEADER STYLING */
        .brand { 
            color: #FFBF00; 
            font-size: 32px; /* Increased size */
            font-weight: bold; 
            margin-bottom: 8px; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .version { 
            color: #FFFFFF; /* Changed to White for better hierarchy */
            font-size: 16px; /* Significantly bigger as requested */
            font-weight: 400;
            margin-bottom: 5px; 
            letter-spacing: 2px;
        }
        .build-tag {
            color: #FFBF00;
            font-size: 12px;
            margin-bottom: 40px;
            opacity: 0.8;
        }
        
        /* THE COCKPIT SYMMETRY */
        .cockpit {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1150px; 
            justify-content: center;
        }
        .card {
            background: #111;
            border: 1px solid #333;
            padding: 20px;
            flex: 1;
            text-align: center;
            border-radius: 4px;
        }
        .card.profit { border: 2px solid #00FF00; }
        .card.target { border: 2px solid #FFBF00; background: #443a00; } 
        
        .label { font-size: 14px; margin-bottom: 15px; display: block; font-weight: bold; }
        .value { font-size: 32px; font-weight: bold; }
        .amber { color: #FFBF00; }
        .green { color: #00FF00; }
    </style>
</head>
<body>

    <div class="brand">The Core | KPI Command Center</div>
    <div class="version">BY DEINESTY SYSTEMS</div>
    <div class="build-tag">SAAS INTERFACE V1.5</div>

    <div class="cockpit">
        <div class="card">
            <span class="label">TOTAL SALES</span>
            <span class="value amber" id="sales">$0.00</span>
        </div>
        <div class="card">
            <span class="label">AD BURN</span>
            <span class="value">$0.00</span>
        </div>
        <div class="card profit">
            <span class="label" style="color: #00FF00;">TRUE NET PROFIT</span>
            <span class="value green" id="net">$0.00</span>
        </div>
        <div class="card target">
            <span class="label">TARGET PROFIT</span>
            <span class="value">$0.00</span>
        </div>
    </div>

    <div style="font-size: 80px; margin-top: 40px;">🚀</div>

</body>
</html>
