<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE CORE | SaaS Dashboard</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-transform: uppercase;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #FFD700; /* Gold */
            letter-spacing: 4px;
            margin-bottom: 5px;
        }

        .version {
            color: #888;
            font-size: 0.8rem;
        }

        .metrics-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: #111;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 20px;
            width: 180px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .main-status-card {
            background: #000;
            border: 3px solid #FFD700; /* Gold Border */
            border-radius: 20px;
            padding: 40px;
            width: 350px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }

        .label { font-size: 0.7rem; color: #888; margin-bottom: 10px; letter-spacing: 2px; }
        .value { font-size: 1.8rem; font-weight: bold; color: #fff; }
        .profit-green { color: #00FF00; text-shadow: 0 0 10px rgba(0,255,0,0.5); }
        .emoji { font-size: 4rem; margin: 15px 0; }
    </style>
</head>
<body>

    <div class="header">
        <h1>THE CORE</h1>
        <div class="version">SaaS Command Center v1.5</div>
    </div>

    <div class="metrics-container">
        <div class="card">
            <div class="label">Total Sales</div>
            <div class="value" id="sales">$0.00</div>
        </div>
        <div class="card">
            <div class="label">Ad Burn</div>
            <div class="value" style="color: #ff4444;" id="ads">$0.00</div>
        </div>
    </div>

    <div class="main-status-card">
        <div class="label">Current Status</div>
        <div class="emoji" id="statusEmoji">🚀</div>
        <div class="label">True Net Profit</div>
        <div class="value profit-green" id="netProfit">$500.00</div>
    </div>

</body>
</html>
